# Render.com Blueprint for Ask Adam (Auth0 accounts + Postgres).
# Deploy: push this repo to GitHub, then in Render click "New +" > "Blueprint".
# Set the secret env vars (Anthropic + Auth0) in the dashboard when prompted.
databases:
  - name: ask-adam-db
    databaseName: askadam
    plan: free

services:
  - type: web
    name: ask-adam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Database connection string, wired automatically from the managed DB above.
      - key: DATABASE_URL
        fromDatabase:
          name: ask-adam-db
          property: connectionString
      # Session cookie encryption secret (auto-generated, kept secret by Render).
      - key: SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: FREE_DAILY_LIMIT
        value: "5"
      - key: NODE_VERSION
        value: "20"
      # Public URL of this service (must match Auth0 Allowed Callback/Logout URLs).
      - key: BASE_URL
        value: https://ask-adam.onrender.com
      # Auth0 application settings.
      - key: ISSUER_BASE_URL
        sync: false
      - key: CLIENT_ID
        sync: false
      # Secret — set in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
