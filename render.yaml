# Render.com Blueprint for Ask Adam (with accounts + Postgres).
# Deploy: push this repo to GitHub, then in Render click "New +" > "Blueprint".
# Set the secret env vars (OpenAI + OAuth) in the dashboard when prompted.
databases:
  - name: ask-adam-db
    databaseName: askadam
    plan: free

services:
  - type: web
    name: ask-adam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Wire the database connection string automatically from the managed DB above.
      - key: DATABASE_URL
        fromDatabase:
          name: ask-adam-db
          property: connectionString
      # Session secret is auto-generated and kept secret by Render.
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-latest
      - key: FREE_DAILY_LIMIT
        value: "5"
      - key: NODE_VERSION
        value: "20"
      # Set this to your live URL after the first deploy (e.g. https://ask-adam.onrender.com).
      - key: APP_URL
        sync: false
      # Secrets — set these in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      # Keep dev login off in production (omit or set to false).
      - key: ALLOW_DEV_LOGIN
        value: "false"
